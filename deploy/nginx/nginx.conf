# =============================================================================
#  图书借阅系统 nginx 配置（Windows / Linux 通用）
#
#  两个站点、两个端口，各配一个后端进程：
#     http://<本机IP>/        管理后台  ->  ruoyi-admin.jar   (127.0.0.1:8080)
#     http://<本机IP>:81/     借阅终端  ->  ruoyi-client.jar  (127.0.0.1:8081)
#
#  前端产物里所有接口请求都带 /prod-api 前缀（见两个前端的 .env.production），
#  由下面的 location /prod-api/ 剥掉前缀后转发给后端。
#
#  用法：解压 nginx 后，用本文件覆盖 nginx 安装目录下的 conf/nginx.conf，
#        再按需改下面两处 root 路径，然后执行 nginx.exe（或 nginx -s reload）。
# =============================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 与后端 spring.servlet.multipart.max-request-size（20MB）保持一致
    client_max_body_size 20m;

    # 前端构建时已生成 .gz 文件（compression-webpack-plugin），直接下发省 CPU
    gzip_static on;
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # 后端返回的 4xx/5xx 不要吃掉，直接透传，方便排查
    proxy_intercept_errors off;

    # =========================================================================
    #  站点一：管理后台前端（80 端口）->  ruoyi-admin.jar
    # =========================================================================
    server {
        listen       80;
        server_name  _;

        # ★ 改这里：管理后台前端产物（ruoyi-ui/dist）的落地目录
        root   D:/ruoyi/web/admin;
        index  index.html;

        # 前端用 history 路由，直接刷新子页面时磁盘上没有对应文件，
        # 必须回落到 index.html 交给前端路由处理，否则刷新就 404。
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 接口转发。^~ 表示"前缀匹配优先于下面的正则 location"，
        # 少了它，形如 /prod-api/profile/upload/x.png 的请求会被下面的
        # 静态资源正则抢走，直接 404 —— 上传头像/图片打不开多是因为这个。
        location ^~ /prod-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            # 结尾的 / 会把 /prod-api 前缀剥掉：
            #   /prod-api/getInfo  ->  http://127.0.0.1:8080/getInfo
            proxy_pass http://127.0.0.1:8080/;
        }

        # 静态资源长缓存（带 hash 的文件名，内容变了文件名就变，可放心缓存）
        location ^~ /static/ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # =========================================================================
    #  站点二：借阅终端前端（81 端口）->  ruoyi-client.jar
    #  与管理后台是两套完全独立的进程/密钥，不要合并到同一个 server 块。
    # =========================================================================
    server {
        listen       81;
        server_name  _;

        # ★ 改这里：终端前端产物（client-front/dist）的落地目录
        root   D:/ruoyi/web/client;
        index  index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ^~ /prod-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://127.0.0.1:8081/;
        }

        location ^~ /static/ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}
