# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi-Client
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，终端服务与管理后台分开部署，占独立端口
  port: 8081
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥：终端服务刻意与管理后台使用不同的密钥。
  # 两边共用同一份 sys_user 与同一个 redis，若密钥相同，终端签发出去的 token（囚犯账号）
  # 可以直接拿去调管理后台的接口；分开之后两边的会话互不通用，囚犯的 token 出了终端就是废票。
  secret: RyCl1ent8Kq2Zm5Tv9Xb3Wc6Nd4Hj7Ls
  # 令牌有效期（默认30分钟）
  expireTime: 30

# 登录准入配置
# 管理后台与终端服务共用一张 sys_user，靠这里的配置划清「哪些角色能登录本进程」。
# 校验由 framework 层的 LoginRoleService 在登录时执行，两端逻辑同一份。
login:
  # 允许登录本服务的角色，逗号分隔；留空表示不限制。
  # 终端面向囚犯，只放行「囚犯」角色（ssk_prisoner）；管理端账号即便密码正确也登不进终端。
  # 管理员若确实需要在终端上排查问题，用管理端账号走管理端接口，不要把 admin 加到这里。
  allowed-roles: ssk_prisoner

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'client'
      display-name: '终端接口'
      paths-to-match: '/**'
      # 终端业务接口在 ruoyi-client 模块的 com.ruoyi.client.controller 下；
      # 登录与验证码下沉到 framework 之后，也一并出现在终端文档里，方便联调
      packages-to-scan: com.ruoyi.client.controller,com.ruoyi.framework.web.controller

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接：终端接口统一使用 /client 前缀（如 /client/book/list、/client/borrowRequest/create），
  # 与管理后台的 /system/*、/ssk/* 分开，XSS 过滤也就按这个前缀生效。
  # 注意 /login、/captchaImage 不带前缀，且本来就不在过滤范围内（与管理后台一致）。
  urlPatterns: /client/*
